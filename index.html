<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Survival Kingdom Demo</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#17252b;font-family:system-ui;touch-action:none}canvas{width:100%;height:100%;display:block}#ui{position:absolute;inset:0;color:white;pointer-events:none}.p{background:#101b20cc;border:1px solid #ffffff44;border-radius:12px;padding:9px 12px}#logo{position:absolute;top:10px;left:10px;font-weight:800}#stats{position:absolute;right:10px;top:10px;text-align:right;font-size:12px}#msg{position:absolute;top:72px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap}#bottom{position:absolute;bottom:18px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;gap:10px}#stick{width:112px;height:112px;border:2px solid #ffffff77;background:#ffffff22;border-radius:100%;position:relative;pointer-events:auto}#nub{width:44px;height:44px;background:#eee;border-radius:50%;position:absolute;left:32px;top:32px}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;pointer-events:auto}button{background:#172a30ed;color:white;border:1px solid #ffffff66;border-radius:11px;padding:12px 8px;font-weight:700;font-size:11px;min-height:46px}#hint{position:absolute;bottom:140px;left:0;right:0;text-align:center;font-size:11px;text-shadow:0 1px 4px black}
</style></head><body><canvas id="c"></canvas><div id="ui"><div id="logo" class="p">⚔ SURVIVAL KINGDOM · DEMO 0.1</div><div id="stats" class="p">🪵 <b id="w">0</b> &nbsp; 🪨 <b id="s">0</b><br>🏠 Cabaña: <b id="h">No</b></div><div id="msg" class="p">Explora el bosque vikingo</div><div id="hint">Joystick para moverte · Arrastra para mirar</div><div id="bottom"><div id="stick"><div id="nub"></div></div><div class="buttons"><button id="g">🪓 RECOGER</button><button id="cam">🎥 CÁMARA</button><button id="b">🏠 CONSTRUIR<br>(8 MADERAS)</button><button id="j">⬆ SALTAR</button></div></div></div>
<script src="https://cdn.babylonjs.com/babylon.js"></script><script>
(()=>{const $=id=>document.getElementById(id),say=t=>$('msg').textContent=t,c=$('c');if(!window.BABYLON){say('Conéctate a internet para cargar el motor 3D');return}
const B=BABYLON,e=new B.Engine(c,true),sc=new B.Scene(e);sc.clearColor=new B.Color4(.56,.72,.78,1);sc.fogMode=B.Scene.FOGMODE_EXP2;sc.fogDensity=.008;sc.fogColor=new B.Color3(.56,.7,.73);
const cam=new B.ArcRotateCamera('cam',-Math.PI/2,1.1,8,new B.Vector3(0,1,0),sc);cam.lowerRadiusLimit=.15;cam.upperRadiusLimit=12;cam.lowerBetaLimit=.25;cam.upperBetaLimit=1.48;new B.HemisphericLight('sky',new B.Vector3(0,1,0),sc);
const sun=new B.DirectionalLight('sun',new B.Vector3(-.5,-1,.4),sc);sun.position.set(20,35,-15);
function M(n,col){let m=new B.StandardMaterial(n,sc);m.diffuseColor=B.Color3.FromHexString(col);return m}
let green=M('grass','#536f43'),dark=M('pine','#254c35'),brown=M('wood','#67452c'),stoneM=M('stone','#778084'),blue=M('river','#397c8b'),cloth=M('cloth','#46545a'),skin=M('skin','#b98260'),iron=M('iron','#899397');
let ground=B.MeshBuilder.CreateGround('ground',{width:100,height:100},sc);ground.material=green;let river=B.MeshBuilder.CreateGround('river',{width:12,height:70},sc);river.position.set(20,.02,0);river.material=blue;
for(let i=0;i<10;i++){let m=B.MeshBuilder.CreateCylinder('mountain',{height:15,diameterTop:0,diameterBottom:15,tessellation:5},sc);m.position.set(-45+i*10,7,-43);m.material=stoneM}
let items=[];function tree(x,z){let t=B.MeshBuilder.CreateCylinder('trunk',{height:2.4,diameter:.4},sc);t.position.set(x,1.2,z);t.material=brown;let f=B.MeshBuilder.CreateSphere('pine',{diameter:2.8,segments:5},sc);f.position.set(x,3,z);f.scaling.y=1.3;f.material=dark;items.push({a:f,b:t,type:'w',x,z})}
function rock(x,z){let r=B.MeshBuilder.CreateIcoSphere('rock',{radius:.7,subdivisions:1},sc);r.position.set(x,.45,z);r.material=stoneM;items.push({a:r,b:null,type:'s',x,z})}
for(let i=0;i<38;i++){let x=(Math.random()-.5)*60,z=(Math.random()-.5)*60;if(Math.abs(x)>7||Math.abs(z)>7)tree(x,z)}for(let i=0;i<18;i++)rock((Math.random()-.5)*50,(Math.random()-.5)*50);
let p=new B.TransformNode('viking',sc);function box(n,w,h,d,x,y,z,ma){let o=B.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},sc);o.position.set(x,y,z);o.material=ma;o.parent=p;return o}
box('body',.75,1.15,.42,0,1.15,0,cloth);let head=B.MeshBuilder.CreateSphere('head',{diameter:.48},sc);head.position.set(0,1.95,0);head.material=skin;head.parent=p;let hair=B.MeshBuilder.CreateSphere('hair',{diameter:.5},sc);hair.position.set(0,2.13,0);hair.scaling.y=.5;hair.material=brown;hair.parent=p;box('legL',.25,.7,.3,-.2,.35,0,brown);box('legR',.25,.7,.3,.2,.35,0,brown);box('axe',.1,.85,.1,.65,1.2,.2,brown);box('blade',.4,.25,.12,.8,1.5,.2,iron);
let cabin=new B.TransformNode('cabin',sc);function cb(n,w,h,d,x,y,z,ma){let o=B.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},sc);o.position.set(x,y,z);o.material=ma;o.parent=cabin;return o}cb('walls',4,2,4,0,1,0,brown);let r1=cb('roof1',2.5,.2,4.5,-1,2.2,0,stoneM);r1.rotation.z=-.55;let r2=cb('roof2',2.5,.2,4.5,1,2.2,0,stoneM);r2.rotation.z=.55;cabin.setEnabled(false);
let wood=0,stones=0,third=true,jv=0,grounded=true,mv={x:0,y:0},keys={};function updateCam(){cam.radius=third?8:.15;cam.target=p.position.add(new B.Vector3(0,third?1.25:1.8,0))}updateCam();
function nearest(){let best=null,d0=3.5;for(let it of items){let d=Math.hypot(it.x-p.position.x,it.z-p.position.z);if(d<d0){best=it;d0=d}}return best}
$('g').onclick=()=>{let it=nearest();if(!it){say('Acércate a un árbol o una roca');return}if(it.type==='w'){wood+=2;it.a.dispose();it.b.dispose()}else{stones++;it.a.dispose()}items.splice(items.indexOf(it),1);$('w').textContent=wood;$('s').textContent=stones;say(it.type==='w'?'Has recogido madera':'Has recogido piedra')};
$('b').onclick=()=>{if(wood<8){say('Necesitas 8 maderas');return}wood-=8;$('w').textContent=wood;cabin.position.set(p.position.x+3,0,p.position.z+2);cabin.setEnabled(true);$('h').textContent='Sí';say('¡Tu primera cabaña está construida!')};
$('cam').onclick=()=>{third=!third;updateCam();say(third?'Tercera persona':'Primera persona')};$('j').onclick=()=>{if(grounded){jv=7;grounded=false}};
let stick=$('stick'),nub=$('nub'),sid=null;function sm(e){let q=stick.getBoundingClientRect(),dx=e.clientX-(q.left+q.width/2),dy=e.clientY-(q.top+q.height/2),len=Math.hypot(dx,dy),max=38;if(len>max){dx*=max/len;dy*=max/len}nub.style.transform=`translate(${dx}px,${dy}px)`;mv={x:dx/max,y:-dy/max}}
stick.onpointerdown=e=>{sid=e.pointerId;stick.setPointerCapture(sid);sm(e)};stick.onpointermove=e=>{if(e.pointerId===sid)sm(e)};function sr(){sid=null;mv={x:0,y:0};nub.style.transform='translate(0,0)'}stick.onpointerup=sr;stick.onpointercancel=sr;
let look=null,lx=0,ly=0;c.onpointerdown=e=>{look=e.pointerId;lx=e.clientX;ly=e.clientY};c.onpointermove=e=>{if(e.pointerId!==look)return;cam.alpha-=(e.clientX-lx)*.006;cam.beta=Math.max(.25,Math.min(1.45,cam.beta+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY};c.onpointerup=()=>look=null;c.onpointercancel=()=>look=null;
onkeydown=e=>keys[e.key.toLowerCase()]=true;onkeyup=e=>keys[e.key.toLowerCase()]=false;let time=0;
sc.onBeforeRenderObservable.add(()=>{let dt=Math.min(e.getDeltaTime()/1000,.04);time+=dt;let x=mv.x+(keys.d?1:0)-(keys.a?1:0),y=mv.y+(keys.w?1:0)-(keys.s?1:0);let f=new B.Vector3(Math.sin(cam.alpha),0,Math.cos(cam.alpha)),rt=new B.Vector3(f.z,0,-f.x),dir=rt.scale(x).add(f.scale(y));if(dir.length()>1)dir.normalize();if(dir.length()>.05){p.position.addInPlace(dir.scale(4*dt));p.rotation.y=Math.atan2(dir.x,dir.z)}jv-=18*dt;p.position.y=Math.max(0,p.position.y+jv*dt);if(p.position.y===0){jv=0;grounded=true}cam.target=p.position.add(new B.Vector3(0,third?1.25:1.8,0))});
e.runRenderLoop(()=>sc.render());addEventListener('resize',()=>e.resize())})();
</script></body></html>
