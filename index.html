const stick=$('stick'),nub=$('nub');let sid=null;function stickMove(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=38;if(len>max){dx*=max/len;dy*=max/len}nub.style.transform=`translate(${dx}px,${dy}px)`;mv={x:dx/max,y:-dy/max}}stick.onpointerdown=e=>{sid=e.pointerId;stick.setPointerCapture(sid);stickMove(e)};stick.onpointermove=e=>{if(e.pointerId===sid)stickMove(e)};function resetStick(){sid=null;mv={x:0,y:0};nub.style.transform='translate(0,0)'}stick.onpointerup=resetStick;stick.onpointercancel=resetStick;

scene.onBeforeRenderObservable.add(()=>{let dt=Math.min(engine.getDeltaTime()/1000,.04),x=mv.x+(keys.d?1:0)-(keys.a?1:0),y=mv.y+(keys.w?1:0)-(keys.s?1:0),forward=new B.Vector3(Math.sin(camera.alpha),0,Math.cos(camera.alpha)),right=new B.Vector3(forward.z,0,-forward.x),dir=right.scale(x).add(forward.scale(y));if(dir.length()>1)dir.normalize();if(dir.length()>.05){player.position.addInPlace(dir.scale(3.8*dt));player.rotation.y=Math.atan2(dir.x,dir.z);walkTime+=dt*9;cloakTailL.rotation.x=-.08+Math.sin(walkTime*.5)*.08;cloakTailR.rotation.x=-.08+Math.sin(walkTime*.5+1)*.08;legs[0].rotation.x=Math.sin(walkTime)*.48;legs[1].rotation.x=-Math.sin(walkTime)*.48;arms[0].rotation.x=-Math.sin(walkTime)*.25;arms[1].rotation.x=Math.sin(walkTime)*.25}else{legs.forEach(l=>l.rotation.x*=.8);arms.forEach(a=>a.rotation.x*=.8);cloakTailL.rotation.x+=(-.08-cloakTailL.rotation.x)*dt*2;cloakTailR.rotation.x+=(-.08-cloakTailR.rotation.x)*dt*2}jump-=18*dt;player.position.y=Math.max(0,player.position.y+jump*dt);if(player.position.y===0){jump=0;grounded=true}camera.target=player.position.add(new B.Vector3(0,third?1.35:2,0));});
